<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Hệ thống quản lý tài khoản</title>
    <style>
        /* Reset & base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Login container */
        #login-container {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 50px 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 420px;
            max-width: 100%;
            border: 1px solid rgba(255,255,255,0.2);
            animation: slideUp 0.6s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #login-container .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 10px;
        }
        #login-container h2 {
            text-align: center;
            color: #2d3748;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        #login-container .subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .login-field {
            margin-bottom: 20px;
        }
        .login-field label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #2d3748;
            font-size: 14px;
        }
        .login-field input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 15px;
            transition: all 0.3s;
            background: #f7fafc;
            color: #2d3748;
        }
        .login-field input:focus {
            border-color: #667eea;
            outline: none;
            background: white;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.15);
            transform: scale(1.01);
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(102,126,234,0.4);
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.5);
        }
        .login-btn:active {
            transform: translateY(0);
        }
        .login-error {
            color: #fc8181;
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            font-weight: 600;
            background: #fff5f5;
            padding: 10px;
            border-radius: 10px;
        }

        /* Dashboard */
        #dashboard {
            display: none;
            width: 100%;
            max-width: 1300px;
            padding: 20px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .dash-header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 20px 32px;
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .dash-header-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .dash-header h1 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .role-badge {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(102,126,234,0.3);
        }
        .logout-btn {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            color: white;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(245,87,108,0.4);
        }
        .logout-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 25px rgba(245,87,108,0.5);
        }

        /* Main grid */
        .dash-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.3);
            transition: all 0.3s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
        }
        .card h3 {
            font-size: 20px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card h3::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, #667eea, transparent);
        }
        .card ul {
            list-style: none;
            margin-top: 6px;
        }
        .card li {
            padding: 12px 0;
            border-bottom: 2px solid #f7fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #2d3748;
            transition: all 0.2s;
        }
        .card li:hover {
            background: #f7fafc;
            padding-left: 10px;
            border-radius: 8px;
        }
        .card li:last-child {
            border-bottom: none;
        }
        .account-name {
            font-weight: 600;
            font-size: 15px;
        }
        .account-role {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 16px;
            border-radius: 40px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .account-role.user {
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            color: #2d3748;
        }
        .account-role.admin {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
        }
        .account-role.owner {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
        }

        /* Form */
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #2d3748;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 14px;
            background: #f7fafc;
            transition: all 0.3s;
            color: #2d3748;
        }
        .form-group input:focus {
            border-color: #667eea;
            outline: none;
            background: white;
            box-shadow: 0 0 0 4px rgba(102,126,234,0.12);
        }
        .create-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            color: white;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            box-shadow: 0 4px 15px rgba(102,126,234,0.3);
        }
        .create-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102,126,234,0.4);
        }
        .create-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            height: 2px;
            background: linear-gradient(90deg, #667eea, #764ba2, transparent);
            margin: 24px 0;
            border-radius: 2px;
        }

        /* Update page */
        .update-placeholder {
            text-align: center;
            padding: 80px 20px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.08);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .update-placeholder .icon {
            font-size: 72px;
            margin-bottom: 20px;
            display: block;
        }
        .update-placeholder h2 {
            font-size: 28px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 10px;
        }
        .update-placeholder p {
            color: #718096;
            font-size: 16px;
        }

        /* Responsive */
        @media (max-width: 850px) {
            .dash-grid {
                grid-template-columns: 1fr;
            }
            .dash-header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .dash-header-left {
                justify-content: center;
                flex-wrap: wrap;
            }
            .logout-btn {
                justify-content: center;
            }
        }
        @media (max-width: 480px) {
            #login-container {
                padding: 30px 20px;
            }
            .card {
                padding: 20px;
            }
        }

        /* Messages */
        .msg-success {
            color: #48bb78;
            background: #f0fff4;
            padding: 8px 14px;
            border-radius: 10px;
            margin-top: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        .msg-error {
            color: #fc8181;
            background: #fff5f5;
            padding: 8px 14px;
            border-radius: 10px;
            margin-top: 8px;
            font-weight: 600;
            font-size: 14px;
        }
        .mt-2 { margin-top: 10px; }
        .text-sm { font-size: 14px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-container">
    <div class="logo">🚀</div>
    <h2>Chào mừng trở lại</h2>
    <p class="subtitle">Đăng nhập để tiếp tục quản lý hệ thống</p>
    <div class="login-field">
        <label>👤 Tên đăng nhập</label>
        <input type="text" id="loginUsername" placeholder="Nhập tên đăng nhập của bạn" />
    </div>
    <div class="login-field">
        <label>🔒 Mật khẩu</label>
        <input type="password" id="loginPassword" placeholder="Nhập mật khẩu" />
    </div>
    <button class="login-btn" id="loginBtn">🚪 Đăng nhập</button>
    <div id="loginError" class="login-error" style="display:none;"></div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
    <!-- header -->
    <div class="dash-header">
        <div class="dash-header-left">
            <h1>📊 Bảng điều khiển</h1>
            <span class="role-badge" id="currentRoleBadge">👑 Owner</span>
        </div>
        <button class="logout-btn" id="logoutBtn">🚪 Đăng xuất</button>
    </div>

    <!-- nội dung chính -->
    <div id="dashboardContent"></div>
</div>

<script>
    (function() {
        // ---------- DỮ LIỆU MẪU ----------
        let accounts = [
            { id: 1, username: 'owner1', password: 'owner123', role: 'owner' },
            { id: 2, username: 'admin1', password: 'admin123', role: 'admin' },
            { id: 3, username: 'user1', password: 'user123', role: 'user' },
        ];
        let currentUser = null;

        // DOM refs
        const loginContainer = document.getElementById('login-container');
        const dashboard = document.getElementById('dashboard');
        const dashboardContent = document.getElementById('dashboardContent');
        const currentRoleBadge = document.getElementById('currentRoleBadge');
        const loginUsername = document.getElementById('loginUsername');
        const loginPassword = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');
        const logoutBtn = document.getElementById('logoutBtn');

        function findAccount(username, password) {
            return accounts.find(acc => acc.username === username && acc.password === password);
        }

        function getNonOwnerAccounts() {
            return accounts.filter(acc => acc.role !== 'owner');
        }

        function getUserAccounts() {
            return accounts.filter(acc => acc.role === 'user');
        }

        function getAdminAccounts() {
            return accounts.filter(acc => acc.role === 'admin');
        }

        function renderDashboard(user) {
            if (!user) return;
            const role = user.role;
            
            const roleEmojis = { owner: '👑', admin: '🛡️', user: '👤' };
            const roleNames = { owner: 'Owner', admin: 'Admin', user: 'Người dùng' };
            currentRoleBadge.textContent = `${roleEmojis[role]} ${roleNames[role]}`;

            if (role === 'user') {
                dashboardContent.innerHTML = `
                    <div class="update-placeholder">
                        <span class="icon">🚧</span>
                        <h2>Website đang được cập nhật</h2>
                        <p>Chúng tôi đang nâng cấp hệ thống để phục vụ bạn tốt hơn</p>
                        <p style="margin-top: 10px; font-size: 14px; color: #a0aec0;">⏳ Vui lòng quay lại sau</p>
                    </div>
                `;
                return;
            }

            const isOwner = role === 'owner';
            const isAdmin = role === 'admin';
            const myAccount = user;

            let managedAccounts = [];
            if (isOwner) {
                managedAccounts = accounts.filter(acc => acc.id !== user.id);
            } else if (isAdmin) {
                managedAccounts = getUserAccounts();
            }

            let html = `<div class="dash-grid">`;

            // Cột trái: Quản lí tài khoản
            html += `<div class="card">
                <h3>📋 Quản lí tài khoản</h3>
                <div style="margin-bottom: 20px;">
                    <h4 style="font-weight:700; font-size:16px; color:#2d3748; margin-bottom:10px;">👤 Tài khoản của bạn</h4>
                    <ul>
                        <li>
                            <span class="account-name">${myAccount.username}</span>
                            <span class="account-role ${myAccount.role}">${myAccount.role}</span>
                        </li>
                    </ul>
                </div>
                <div>
                    <h4 style="font-weight:700; font-size:16px; color:#2d3748; margin-bottom:10px;">📌 Tài khoản bạn quản lí</h4>
                    ${managedAccounts.length === 0 ? `<p style="color: #718096; padding: 10px 0;">Không có tài khoản nào</p>` : `
                        <ul>
                            ${managedAccounts.map(acc => `
                                <li>
                                    <span class="account-name">${acc.username}</span>
                                    <span class="account-role ${acc.role}">${acc.role}</span>
                                </li>
                            `).join('')}
                        </ul>
                    `}
                </div>
            </div>`;

            // Cột phải: Tạo tài khoản
            html += `<div class="card">
                <h3>➕ Tạo tài khoản mới</h3>`;

            if (isOwner) {
                html += `
                    <div style="margin-bottom: 20px;">
                        <h4 style="font-weight:700; font-size:16px; color:#2d3748; margin-bottom:12px;">👑 Tài khoản Admin</h4>
                        <div class="form-group">
                            <label>Tên đăng nhập</label>
                            <input type="text" id="newAdminUsername" placeholder="Nhập tên admin" />
                        </div>
                        <div class="form-group">
                            <label>Mật khẩu</label>
                            <input type="password" id="newAdminPassword" placeholder="Nhập mật khẩu" />
                        </div>
                        <button class="create-btn" id="createAdminBtn">✨ Tạo Admin</button>
                        <div id="createAdminMsg" class="mt-2"></div>
                    </div>
                    <div class="divider"></div>
                `;
            }

            html += `
                <div>
                    <h4 style="font-weight:700; font-size:16px; color:#2d3748; margin-bottom:12px;">👤 Tài khoản Người dùng</h4>
                    <div class="form-group">
                        <label>Tên đăng nhập</label>
                        <input type="text" id="newUserUsername" placeholder="Nhập tên người dùng" />
                    </div>
                    <div class="form-group">
                        <label>Mật khẩu</label>
                        <input type="password" id="newUserPassword" placeholder="Nhập mật khẩu" />
                    </div>
                    <button class="create-btn" id="createUserBtn">✨ Tạo Người dùng</button>
                    <div id="createUserMsg" class="mt-2"></div>
                </div>
            `;

            html += `</div></div>`;
            dashboardContent.innerHTML = html;

            // ---- Sự kiện tạo admin ----
            if (isOwner) {
                const createAdminBtn = document.getElementById('createAdminBtn');
                const newAdminUsername = document.getElementById('newAdminUsername');
                const newAdminPassword = document.getElementById('newAdminPassword');
                const createAdminMsg = document.getElementById('createAdminMsg');

                createAdminBtn.addEventListener('click', function() {
                    const username = newAdminUsername.value.trim();
                    const password = newAdminPassword.value.trim();
                    if (!username || !password) {
                        createAdminMsg.className = 'msg-error';
                        createAdminMsg.textContent = '⚠️ Vui lòng nhập đầy đủ thông tin';
                        return;
                    }
                    if (accounts.some(acc => acc.username === username)) {
                        createAdminMsg.className = 'msg-error';
                        createAdminMsg.textContent = '⚠️ Tên đăng nhập đã tồn tại';
                        return;
                    }
                    const newId = accounts.length ? Math.max(...accounts.map(a => a.id)) + 1 : 1;
                    accounts.push({ id: newId, username, password, role: 'admin' });
                    createAdminMsg.className = 'msg-success';
                    createAdminMsg.textContent = `✅ Đã tạo admin "${username}" thành công!`;
                    newAdminUsername.value = '';
                    newAdminPassword.value = '';
                    renderDashboard(currentUser);
                });
            }

            // ---- Sự kiện tạo user ----
            const createUserBtn = document.getElementById('createUserBtn');
            const newUserUsername = document.getElementById('newUserUsername');
            const newUserPassword = document.getElementById('newUserPassword');
            const createUserMsg = document.getElementById('createUserMsg');

            createUserBtn.addEventListener('click', function() {
                const username = newUserUsername.value.trim();
                const password = newUserPassword.value.trim();
                if (!username || !password) {
                    createUserMsg.className = 'msg-error';
                    createUserMsg.textContent = '⚠️ Vui lòng nhập đầy đủ thông tin';
                    return;
                }
                if (accounts.some(acc => acc.username === username)) {
                    createUserMsg.className = 'msg-error';
                    createUserMsg.textContent = '⚠️ Tên đăng nhập đã tồn tại';
                    return;
                }
                const newId = accounts.length ? Math.max(...accounts.map(a => a.id)) + 1 : 1;
                accounts.push({ id: newId, username, password, role: 'user' });
                createUserMsg.className = 'msg-success';
                createUserMsg.textContent = `✅ Đã tạo người dùng "${username}" thành công!`;
                newUserUsername.value = '';
                newUserPassword.value = '';
                renderDashboard(currentUser);
            });
        }

        function login(username, password) {
            const account = findAccount(username, password);
            if (!account) {
                loginError.style.display = 'block';
                loginError.textContent = '❌ Sai tên đăng nhập hoặc mật khẩu';
                return false;
            }
            currentUser = { ...account };
            loginError.style.display = 'none';
            loginContainer.style.display = 'none';
            dashboard.style.display = 'block';
            renderDashboard(currentUser);
            return true;
        }

        function logout() {
            currentUser = null;
            dashboard.style.display = 'none';
            loginContainer.style.display = 'block';
            loginUsername.value = '';
            loginPassword.value = '';
            loginError.style.display = 'none';
        }

        // Sự kiện
        loginBtn.addEventListener('click', function() {
            const username = loginUsername.value.trim();
            const password = loginPassword.value.trim();
            if (!username || !password) {
                loginError.style.display = 'block';
                loginError.textContent = '⚠️ Vui lòng nhập tên và mật khẩu';
                return;
            }
            login(username, password);
        });

        loginUsername.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });
        loginPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') loginBtn.click(); });
        logoutBtn.addEventListener('click', logout);

        // Khởi tạo
        loginContainer.style.display = 'block';
        dashboard.style.display = 'none';
        
        console.log('🚀 Hệ thống sẵn sàng!');
        console.log('📝 Tài khoản mẫu:');
        console.log('👑 owner1 / owner123');
        console.log('🛡️ admin1 / admin123');
        console.log('👤 user1 / user123');
    })();
</script>
</body>
</html>
